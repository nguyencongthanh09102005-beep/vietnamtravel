name: Validate app

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: vietnam-travel-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck frontend
        run: npm run typecheck

      - name: Typecheck API functions
        run: npm run typecheck:api

      - name: Validate referenced local images
        run: node scripts/check-assets.mjs

      - name: Repository content tests
        run: node --test scripts/content-integrity.test.mjs

      - name: API behavior tests
        run: npm run test:api

      - name: Local API middleware integration tests
        run: node --test scripts/local-api.test.mjs

      - name: Build production bundle
        run: npm run build

  windows-sqlite-integration:
    name: Windows SQLite cleanup and local API
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Test local SQLite API and temp file cleanup
        run: node --test scripts/local-api.test.mjs
