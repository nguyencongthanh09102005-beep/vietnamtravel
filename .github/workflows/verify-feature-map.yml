name: Validate VietnamTravel feature branch

on:
  push:
    branches:
      - feature/vietnamtravel-map-affiliate-osm-20261114
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck web
        run: npm run typecheck
      - name: Typecheck server
        run: npm run typecheck:api
      - name: API tests
        run: npm run test:api
      - name: Vite production build (no deployment)
        run: npm run build
